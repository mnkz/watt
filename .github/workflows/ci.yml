name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: cargo test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: format
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --locked -- -D warnings
      - name: tests
        run: cargo test --locked
